<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>FaceAlbum — Find Me</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script>window.VITE_API_URL='https://mdarfan-faceapp-backend.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">📸</div>
    <span class="nav-brand-name">FaceAlbum</span>
  </div>
  <div class="nav-links" id="nav-links"></div>
</nav>
<div class="bottom-nav" id="bottom-nav"></div>

<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">Face Recognition</div>
    <h1 class="page-title">Find My Photos</h1>
    <p class="page-sub">Take or upload a photo to find all your pictures across every event</p>
  </div>
  <div id="app"></div>
</main>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
const me = getUser();
buildNav('index', me);

const app = document.getElementById('app');
let streamRef=null, facingMode='user', state='idle', previewUrl=null, resultData=null, errorMsg='';

function render() {
  if (state==='idle')    renderIdle();
  if (state==='camera')  renderCamera();
  if (state==='loading') renderLoading();
  if (state==='result')  renderResult();
  if (state==='error')   renderError();
}

function renderIdle() {
  app.innerHTML = `
    <div class="recognize-wrap">
      <div class="recognize-options">
        <button class="option-btn primary" id="btn-cam">
          <div class="option-icon">${Icons.camera}</div>
          <div><div class="option-label">Take a photo</div><div class="option-hint">Use your front or rear camera</div></div>
        </button>
        <div class="or-divider">or</div>
        <button class="option-btn" id="btn-up">
          <div class="option-icon">${Icons.upload}</div>
          <div><div class="option-label">Upload a photo</div><div class="option-hint">Choose from your device</div></div>
        </button>
        <input type="file" id="fi" accept="image/*" style="display:none"/>
        <div class="recognize-tip">
          ${Icons.person}
          <span>Works best with a clear, front-facing photo — one face only</span>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-cam').onclick = () => startCamera('user');
  document.getElementById('btn-up').onclick  = () => document.getElementById('fi').click();
  document.getElementById('fi').onchange     = e => { const f=e.target.files?.[0]; if(f) handleFile(f); };
}

function renderCamera() {
  app.innerHTML = `
    <div class="camera-wrap">
      <div class="camera-viewport">
        <video id="cv" autoplay playsinline muted class="camera-video"></video>
        <div class="camera-overlay"><div class="face-guide"></div></div>
        <p class="camera-hint">Position your face in the circle</p>
      </div>
      <div class="camera-controls">
        <button class="cam-cancel btn btn-ghost" onclick="reset()">Cancel</button>
        <button class="cam-shutter" id="cap"><div class="cam-shutter-inner"></div></button>
        <button class="cam-flip" id="flip">${Icons.flip}</button>
      </div>
    </div>`;
  setTimeout(() => { const v=document.getElementById('cv'); if(v&&streamRef){v.srcObject=streamRef;v.play();} },50);
  document.getElementById('cap').onclick = captureFrame;
  document.getElementById('flip').onclick = () => startCamera(facingMode==='user'?'environment':'user');
}

function renderLoading() {
  app.innerHTML = `
    <div class="recognize-result">
      ${previewUrl ? `<img src="${previewUrl}" class="preview-img"/>` : ''}
      <div class="spinner-wrap"><div class="spinner"></div><p style="color:var(--text2);font-size:14px">Searching for your face...</p></div>
    </div>`;
}

function renderResult() {
  const r = resultData;
  if (!r.matched) {
    app.innerHTML = `
      <div class="recognize-result">
        ${previewUrl ? `<img src="${previewUrl}" class="preview-img"/>` : ''}
        <div class="result-card" style="text-align:center">
          <div style="font-size:48px;margin-bottom:12px">🔍</div>
          <h2 style="margin-bottom:8px">No match found</h2>
          <p style="color:var(--text2);margin-bottom:20px;font-size:14px">${r.message}</p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="startCamera('user')">${Icons.camera} Try camera</button>
            <button class="btn btn-secondary" onclick="reset()">${Icons.upload} Upload instead</button>
          </div>
        </div>
      </div>`;
    return;
  }

  // ── FIXED: use string concatenation, not template literal with r.person_name ──
  const nameHtml = r.is_named
    ? '<div class="result-found-name">' + r.person_name + '</div><div class="result-found-sub">' + r.confidence + '% match confidence</div>'
    : '<div class="result-found-name" style="color:var(--text2)">Not yet named</div>'
      + '<div class="result-unnamed-pill" style="margin-top:8px"><span style="font-size:11px;color:var(--text3)">ID:</span><span class="result-unnamed-id">' + r.person_id + '</span></div>'
      + '<div class="result-unnamed-hint" style="margin-top:6px">Sign in → People → find yourself → click ✏️ to add your name</div>';

  const loginPromptHtml = !me
    ? `<div class="login-prompt">
        <p>Want to browse <span>all events and people</span>?</p>
        <button class="btn btn-primary btn-sm" onclick="location.href='login.html'">Sign in with Google</button>
       </div>`
    : '';

  const eventsHtml = (r.events || []).map(ev => {
    const photos = ev.photos.map(p =>
      '<div class="photo-tile" onclick="openLightbox(\'' + imageUrl(p.drive_file_id) + '\',\'\',\'\')">'
      + '<img src="' + thumbUrl(p.drive_file_id) + '" alt="" onerror="this.parentElement.innerHTML=\'<div class=photo-skeleton></div>\'" />'
      + '</div>'
    ).join('');
    return '<div class="result-event-block">'
      + '<div class="result-event-title">' + ev.event_name + ' &middot; ' + ev.photos.length + ' photos</div>'
      + '<div class="result-photo-grid">' + photos + '</div>'
      + '</div>';
  }).join('');

  const viewAllBtn = me
    ? '<button class="btn btn-primary" onclick="location.href=\'pages/person.html?id=' + r.person_id + '\'">' + Icons.person + ' View all my photos</button>'
    : '';

  app.innerHTML = `
    <div class="recognize-result">
      ${previewUrl ? '<img src="' + previewUrl + '" class="preview-img"/>' : ''}
      <div class="result-card">
        <div class="result-found-header">
          <div class="result-found-avatar">${r.person_name ? initials(r.person_name) : '?'}</div>
          <div>${nameHtml}</div>
        </div>
        <div class="count-banner">
          <div class="count-box"><div class="count-num">${r.total_photos}</div><div class="count-label">Your photos</div></div>
          <div class="count-box"><div class="count-num">${(r.events||[]).length}</div><div class="count-label">Events</div></div>
          <div class="count-box"><div class="count-num">${r.confidence}%</div><div class="count-label">Confidence</div></div>
        </div>
        ${loginPromptHtml}
        ${eventsHtml}
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px">
          ${viewAllBtn}
          <button class="btn btn-ghost" onclick="reset()">${Icons.search} Search again</button>
        </div>
      </div>
    </div>`;
}

function renderError() {
  app.innerHTML = `
    <div class="recognize-result">
      ${previewUrl ? '<img src="' + previewUrl + '" class="preview-img"/>' : ''}
      <div class="result-card" style="text-align:center">
        <div style="font-size:48px;margin-bottom:12px">😕</div>
        <h2 style="margin-bottom:8px">Couldn't find a match</h2>
        <p style="color:var(--text2);margin-bottom:20px;font-size:14px">${errorMsg}</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="startCamera('user')">${Icons.camera} Try camera</button>
          <button class="btn btn-secondary" onclick="reset()">${Icons.upload} Upload instead</button>
        </div>
      </div>
    </div>`;
}

function stopCamera() { if(streamRef){streamRef.getTracks().forEach(t=>t.stop());streamRef=null;} }

async function startCamera(facing) {
  facingMode=facing; stopCamera(); state='camera'; render();
  try {
    streamRef = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=document.getElementById('cv'); if(v){v.srcObject=streamRef;v.play();}
  } catch(e) { stopCamera(); state='idle'; render(); }
}

function captureFrame() {
  const v=document.getElementById('cv'); if(!v) return;
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(blob=>{previewUrl=URL.createObjectURL(blob);stopCamera();submitFile(new File([blob],'capture.jpg',{type:'image/jpeg'}));},'image/jpeg',0.92);
}

function handleFile(file) { previewUrl=URL.createObjectURL(file); submitFile(file); }

async function submitFile(file) {
  state='loading'; render();
  try { resultData=await api.recognizeFace(file); state='result'; }
  catch(e) { errorMsg=e.message; state='error'; }
  render();
}

function reset() { stopCamera(); previewUrl=null; resultData=null; errorMsg=''; state='idle'; render(); }
render();
</script>
</body>
</html>
