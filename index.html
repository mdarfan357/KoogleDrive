<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FaceAlbum — Find My Photos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>window.VITE_API_URL = 'https://mdarfan-faceapp-backend.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-brand-dot"></div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links" id="nav-links">
    <button class="nav-link active">Find Me</button>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1 class="page-title">Find My Photos</h1>
    <p class="page-subtitle">Take or upload a photo to find all your pictures across every event</p>
  </div>
  <div id="app"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
// Inject full nav if logged in
const me = getUser();
if (me) {
  document.getElementById('nav-links').innerHTML = `
    <button class="nav-link active">Find Me</button>
    <button class="nav-link" onclick="location.href='pages/events.html'">Events</button>
    <button class="nav-link" onclick="location.href='pages/persons.html'">People</button>
    <button class="nav-link" onclick="location.href='pages/merge.html'">Review</button>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <span class="nav-user">${me.name||me.email}</span>
      <button class="nav-signout" onclick="signOut()">Sign out</button>
    </div>`;
}

const app = document.getElementById('app');
let streamRef=null, facingMode='user', state='idle', previewUrl=null, resultData=null, errorMsg='';

function render() {
  if (state==='idle')    renderIdle();
  if (state==='camera')  renderCamera();
  if (state==='loading') renderLoading();
  if (state==='result')  renderResult();
  if (state==='error')   renderError();
}

function renderIdle() {
  app.innerHTML = `
    <div class="recognize-options">
      <button class="option-btn primary" id="btn-cam">
        <span class="option-icon">📷</span>
        <span class="option-label">Take a photo</span>
        <span class="option-hint">Use your camera</span>
      </button>
      <div class="or-divider">or</div>
      <button class="option-btn" id="btn-up">
        <span class="option-icon">🖼️</span>
        <span class="option-label">Upload a photo</span>
        <span class="option-hint">Choose from your device</span>
      </button>
      <input type="file" id="fi" accept="image/*" style="display:none" />
      <p class="recognize-tip">💡 Works best with a clear front-facing photo — one face only</p>
    </div>`;
  document.getElementById('btn-cam').onclick = () => startCamera('user');
  document.getElementById('btn-up').onclick  = () => document.getElementById('fi').click();
  document.getElementById('fi').onchange     = e => { const f=e.target.files?.[0]; if(f) handleFile(f); };
}

function renderCamera() {
  app.innerHTML = `
    <div class="camera-wrap">
      <div class="camera-viewport">
        <video id="cv" autoplay playsinline muted class="camera-video"></video>
        <div class="camera-overlay"><div class="face-guide"></div></div>
        <p class="camera-hint">Position your face in the circle</p>
      </div>
      <div class="camera-controls">
        <button class="cam-cancel" onclick="reset()">✕ Cancel</button>
        <button class="cam-shutter" id="cap"><div class="cam-shutter-inner"></div></button>
        <button class="cam-flip" onclick="startCamera(facingMode==='user'?'environment':'user')">🔄</button>
      </div>
    </div>`;
  setTimeout(() => { const v=document.getElementById('cv'); if(v&&streamRef){v.srcObject=streamRef;v.play();} }, 50);
  document.getElementById('cap').onclick = captureFrame;
}

function renderLoading() {
  app.innerHTML = `<div class="recognize-result">
    ${previewUrl?`<img src="${previewUrl}" class="preview-img" />`:''}
    <div class="spinner-wrap"><div class="spinner"></div><p>Searching for your face...</p></div>
  </div>`;
}

function renderResult() {
  const r = resultData;
  if (!r.matched) {
    app.innerHTML = `<div class="recognize-result">
      ${previewUrl?`<img src="${previewUrl}" class="preview-img" />`:''}
      <div class="result-card" style="text-align:center">
        <div class="result-icon">🔍</div><h2>Not found</h2>
        <p style="color:var(--text2);margin-bottom:20px">${r.message}</p>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="startCamera('user')">Try camera</button>
          <button class="btn btn-secondary" onclick="reset()">Upload instead</button>
        </div>
      </div>
    </div>`;
    return;
  }

  const eventsHtml = (r.events||[]).map(ev => `
    <div class="result-event-block">
      <div class="result-event-title">${ev.event_name} · ${ev.photos.length} photos</div>
      <div class="result-photo-grid">
        ${ev.photos.map(p=>`
          <div class="photo-tile" onclick="openLightbox('${imageUrl(p.drive_file_id)}','','')">
            <img src="${thumbUrl(p.drive_file_id)}" alt="" onerror="this.parentElement.innerHTML='<div class=photo-skeleton></div>'" />
          </div>`).join('')}
      </div>
    </div>`).join('');

  const loginPrompt = !me ? `
    <div class="login-prompt">
      <p>Want to browse <span>all events and people</span>?</p>
      <button class="btn btn-primary" onclick="location.href='login.html'">Sign in with Google</button>
    </div>` : '';

  app.innerHTML = `<div class="recognize-result">
    ${previewUrl?`<img src="${previewUrl}" class="preview-img" />`:''}
    <div class="result-card">
      <div class="result-icon">🎉</div>
      <h2>Found you!</h2>
      ${r.person_name?`<div class="result-name">${r.person_name}</div>`:''}
      <div class="count-banner">
        <div class="count-box"><div class="count-num">${r.total_photos}</div><div class="count-label">Your photos</div></div>
        <div class="count-box"><div class="count-num">${(r.events||[]).length}</div><div class="count-label">Events</div></div>
        <div class="count-box"><div class="count-num">${r.confidence}%</div><div class="count-label">Confidence</div></div>
      </div>
      ${loginPrompt}
      ${eventsHtml}
      <div style="text-align:center;margin-top:16px">
        <button class="btn btn-secondary" onclick="reset()">Search again</button>
      </div>
    </div>
  </div>`;
}

function renderError() {
  app.innerHTML = `<div class="recognize-result">
    ${previewUrl?`<img src="${previewUrl}" class="preview-img" />`:''}
    <div class="result-card" style="text-align:center">
      <div class="result-icon">😕</div><h2>Couldn't find a match</h2>
      <p style="color:var(--text2);margin-bottom:20px">${errorMsg}</p>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="startCamera('user')">Try camera</button>
        <button class="btn btn-secondary" onclick="reset()">Upload instead</button>
      </div>
    </div>
  </div>`;
}

function stopCamera() { if(streamRef){streamRef.getTracks().forEach(t=>t.stop());streamRef=null;} }

async function startCamera(facing) {
  facingMode=facing; stopCamera(); state='camera'; render();
  try {
    streamRef = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    const v = document.getElementById('cv'); if(v){v.srcObject=streamRef;v.play();}
  } catch(e) { stopCamera(); state='idle'; render(); }
}

function captureFrame() {
  const v=document.getElementById('cv'); if(!v) return;
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(blob=>{previewUrl=URL.createObjectURL(blob);stopCamera();submitFile(new File([blob],'capture.jpg',{type:'image/jpeg'}));},'image/jpeg',0.92);
}

function handleFile(file) { previewUrl=URL.createObjectURL(file); submitFile(file); }

async function submitFile(file) {
  state='loading'; render();
  try { resultData=await api.recognizeFace(file); state='result'; }
  catch(e) { errorMsg=e.message; state='error'; }
  render();
}

function reset() { stopCamera(); previewUrl=null; resultData=null; errorMsg=''; state='idle'; render(); }
render();
</script>
</body>
</html>
