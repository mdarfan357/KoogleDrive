<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceAlbum — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    window.VITE_API_URL = 'https://your-hf-space.hf.space';
  </script>
  <style>
    .login-wrap { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px; }
    .login-card { background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 36px;width:100%;max-width:400px;text-align:center; }
    .login-logo { font-size:2.5rem;margin-bottom:16px; }
    .login-card h1 { font-size:22px;margin-bottom:6px; }
    .login-sub  { color:var(--text2);font-size:14px;margin-bottom:28px; }
    .login-form { display:flex;flex-direction:column;gap:12px; }
    .login-note { font-size:12px;color:var(--text3);margin-top:8px; }
    .sent-icon  { font-size:2.5rem;margin-bottom:14px; }
    .err-box    { padding:10px 14px;background:var(--red-bg);border:1px solid rgba(248,113,113,0.25);border-radius:var(--radius);color:var(--red);font-size:13px;margin-bottom:14px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div id="form-state">
      <div class="login-logo">📸</div>
      <h1>FaceAlbum</h1>
      <p class="login-sub">Family photo collection — members only</p>
      <div class="err-box" id="err" style="display:none"></div>
      <div class="login-form">
        <input class="input" type="email" id="email" placeholder="your@email.com" autocomplete="email" />
        <button class="btn btn-primary" id="submit-btn" onclick="handleSubmit()" style="width:100%;justify-content:center;">
          Send magic link
        </button>
        <p class="login-note">We'll email you a one-time sign-in link. No password needed.</p>
      </div>
    </div>

    <div id="sent-state" style="display:none">
      <div class="sent-icon">📬</div>
      <h1>Check your email</h1>
      <p class="login-sub" id="sent-msg"></p>
      <p class="login-note" style="margin-top:20px">
        Didn't get it? Check spam, or
        <button onclick="resetForm()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;">try again</button>.
      </p>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
// Show error if redirected back with ?error=
const errParam = new URLSearchParams(location.search).get('error');
if (errParam === 'not_allowed') showErr("Your email isn't on the family list.");
if (errParam === 'expired')     showErr("Your link expired. Please request a new one.");

// Already logged in? Redirect
const existing = getUser();
if (existing) {
  const redirect = sessionStorage.getItem('redirect_after_login') || 'pages/events.html';
  sessionStorage.removeItem('redirect_after_login');
  location.href = redirect;
}

document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const btn   = document.getElementById('submit-btn');
  document.getElementById('err').style.display = 'none';
  if (!email) return;

  btn.textContent = 'Sending...';
  btn.disabled    = true;

  try {
    await sendMagicLink(email);
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('sent-state').style.display = 'block';
    document.getElementById('sent-msg').textContent =
      `We sent a sign-in link to ${email}. Click it to continue.`;
  } catch(e) {
    showErr(e.message);
    btn.textContent = 'Send magic link';
    btn.disabled    = false;
  }
}

function resetForm() {
  document.getElementById('form-state').style.display = 'block';
  document.getElementById('sent-state').style.display = 'none';
  document.getElementById('email').value = '';
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Send magic link';
  btn.disabled    = false;
}
</script>
</body>
</html>
