<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>FaceAlbum — Person</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <script>window.VITE_API_URL='https://mdarfan-faceapp-backend.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-logo">📸</div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links" id="nav-links"></div>
</nav>
<div class="bottom-nav" id="bottom-nav"></div>
<main class="main">
  <button class="back-btn" onclick="location.href='persons.html'">${Icons ? Icons.back : '←'} People</button>
  <div id="header"></div>
  <div id="tabs"></div>
  <div id="app"></div>
</main>

<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Name this person</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input class="input" id="modal-input" placeholder="Enter their name..."/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveName()">Save name</button>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
const personId = getParam('id');
if (!personId) location.href = 'persons.html';
let personData=null, eventsData=[], activeEvent='all';

async function init() {
  const user = await requireAuth(); if (!user) return;
  buildNav('persons', user);
  showSpinner(document.getElementById('app'));
  try {
    const data = await api.getPerson(personId);
    personData=data.person; eventsData=data.events||[];
    document.title = 'FaceAlbum — ' + (personData.name||'Unnamed');
    renderHeader(); renderTabs(); renderPhotos();
    if (!personData.name) {
      try { const s=await api.getSuggestions(personId); renderSuggestions(s.suggestions||[]); } catch(e){}
    }
  } catch(e) { document.getElementById('app').innerHTML = '<p style="color:var(--rose)">Failed: ' + e.message + '</p>'; }
}

function allPhotos() { return eventsData.flatMap(e=>e.photos.map(p=>({...p,event_name:e.event_name}))); }

function renderHeader() {
  const p = personData;
  const avatarInner = p.cover_image_id
    ? '<img src="' + thumbUrl(p.cover_image_id) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>'
    : '<span style="font-size:26px;font-weight:700;color:var(--accent)">' + initials(p.name) + '</span>';
  const namePart = p.name
    ? p.name
    : '<em style="color:var(--text3);font-style:italic;font-weight:400;font-size:18px">Unnamed Person</em>';
  document.getElementById('header').innerHTML =
    '<div class="page-header">'
    + '<div class="person-header">'
    + '<label class="person-header-avatar" style="cursor:pointer" title="Change profile photo">'
    + avatarInner
    + '<div class="person-header-avatar-upload">' + Icons.upload + '</div>'
    + '<input type="file" accept="image/*" style="display:none" id="avatar-input" onchange="uploadThumbnail(this)">'
    + '</label>'
    + '<div class="person-header-info">'
    + '<h1>' + namePart + '<button class="rename-btn" onclick="openModal()" title="Rename">' + Icons.edit + '</button></h1>'
    + '<p class="page-sub">' + allPhotos().length + ' photos across ' + eventsData.length + ' events</p>'
    + '</div></div>'
    + '<div id="suggestions"></div>'
    + '</div>';
}

function renderSuggestions(s) {
  const el = document.getElementById('suggestions'); if (!el||!s.length) return;
  el.innerHTML = '<div class="suggestions-bar"><span class="suggestions-label">Suggested matches:</span>'
    + s.map(x => '<button class="suggestion-chip" onclick="location.href=\'person.html?id=' + x.person_id + '\'">' + x.person_name + ' · ' + x.similarity_pct + '</button>').join('')
    + '</div>';
}

function renderTabs() {
  if (eventsData.length<=1) { document.getElementById('tabs').innerHTML=''; return; }
  document.getElementById('tabs').innerHTML = '<div class="tabs">'
    + '<button class="tab ' + (activeEvent==='all'?'active':'') + '" onclick="setTab(\'all\')">All (' + allPhotos().length + ')</button>'
    + eventsData.map(e=>'<button class="tab ' + (activeEvent===e.event_id?'active':'') + '" onclick="setTab(\'' + e.event_id + '\')">' + e.event_name + ' (' + e.photos.length + ')</button>').join('')
    + '</div>';
}

function setTab(id) { activeEvent=id; renderTabs(); renderPhotos(); }

function renderPhotos() {
  const photos = activeEvent==='all' ? allPhotos() : (eventsData.find(e=>e.event_id===activeEvent)?.photos||[]);
  if (!photos.length) { showEmpty(document.getElementById('app'), Icons.photo, 'No photos'); return; }
  document.getElementById('app').innerHTML = '<div class="photo-grid">'
    + photos.map(p =>
        '<div class="photo-tile" onclick="openLightbox(\'' + imageUrl(p.drive_file_id) + '\',\'' + (p.event_name||'') + '\',\'\')">'
        + '<img src="' + thumbUrl(p.drive_file_id) + '" alt="" onerror="this.parentElement.innerHTML=\'<div class=photo-skeleton></div>\'" />'
        + (p.event_name ? '<div class="photo-label">' + p.event_name + '</div>' : '')
        + '</div>'
    ).join('')
    + '</div>';
}

async function uploadThumbnail(input) {
  const file = input.files?.[0]; if (!file) return;
  showToast('Uploading profile photo...', 'success');
  try {
    const form = new FormData(); form.append('file', file); form.append('person_id', personId);
    const res = await fetch(window.VITE_API_URL + '/persons/' + personId + '/upload-thumbnail', {
      method: 'POST', headers: authHeaders(), body: form
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    personData.cover_image_id = data.cover_image_id;
    renderHeader();
    showToast('Profile photo updated!');
  } catch(e) { showToast('Failed: ' + e.message, 'error'); }
}

function openModal() {
  document.getElementById('modal-input').value = personData.name||'';
  document.getElementById('modal').style.display='flex';
  document.getElementById('modal-input').focus();
  document.getElementById('modal-input').onkeydown = e => { if(e.key==='Enter') saveName(); };
}
function closeModal() { document.getElementById('modal').style.display='none'; }

async function saveName() {
  const name = document.getElementById('modal-input').value.trim(); if (!name) return;
  document.getElementById('modal-save').textContent='Saving...';
  try {
    await api.renamePerson(personId, name);
    personData.name=name; renderHeader(); closeModal(); showToast('Renamed to "' + name + '"');
  } catch(e) { showToast(e.message,'error'); }
  document.getElementById('modal-save').textContent='Save name';
}

document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });
init();
</script>
</body>
</html>
