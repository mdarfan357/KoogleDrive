<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>FaceAlbum — Review</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <script>window.VITE_API_URL='https://your-hf-space.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-logo">📸</div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links" id="nav-links"></div>
</nav>
<div class="bottom-nav" id="bottom-nav"></div>
<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">Curation</div>
    <h1 class="page-title">Review Matches</h1>
    <p class="page-sub" id="sub">Loading...</p>
  </div>
  <div id="app"></div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
let candidates=[];
async function init(){
  const user=await requireAuth();if(!user)return;
  buildNav('merge',user);
  showSpinner(document.getElementById('app'));
  try{
    const data=await api.getMergeCandidates();
    candidates=data.candidates||[];
    document.getElementById('sub').textContent=candidates.length+' pairs need review';
    render();
  }catch(e){document.getElementById('app').innerHTML='<p style="color:var(--rose)">Failed: '+e.message+'</p>';}
}
function render(){
  if(!candidates.length){showEmpty(document.getElementById('app'),Icons.check,'All caught up!','No pending merge candidates.');return;}
  document.getElementById('app').innerHTML=candidates.map(c=>
    '<div class="candidate-card" id="c'+c.id+'">'
    +'<span class="badge badge-accent">'+Math.round(c.similarity*100)+'% match</span>'
    +'<div class="candidate-persons">'
    +'<div style="flex:1"><div class="person-sample-name">'+(c.person_a.name||'<em>Unnamed</em>')+'</div>'
    +'<div class="person-sample-thumbs">'+(c.person_a.sample_thumbnails||[]).slice(0,4).map(u=>'<img src="'+u+'" class="person-sample-img" onerror="this.style.display=\'none\'"/>').join('')+'</div></div>'
    +'<div class="candidate-vs">vs</div>'
    +'<div style="flex:1"><div class="person-sample-name">'+(c.person_b.name||'<em>Unnamed</em>')+'</div>'
    +'<div class="person-sample-thumbs">'+(c.person_b.sample_thumbnails||[]).slice(0,4).map(u=>'<img src="'+u+'" class="person-sample-img" onerror="this.style.display=\'none\'"/>').join('')+'</div></div>'
    +'</div>'
    +'<div class="candidate-actions">'
    +'<button class="btn btn-success btn-sm" id="m'+c.id+'" onclick="resolve('+c.id+',\'merge\')">'+Icons.check+' Same person — merge</button>'
    +'<button class="btn btn-danger btn-sm" id="r'+c.id+'" onclick="resolve('+c.id+',\'reject\')">'+Icons.x+' Different people</button>'
    +'</div></div>').join('');
}
async function resolve(id,action){
  ['m','r'].forEach(p=>{const b=document.getElementById(p+id);if(b){b.disabled=true;b.textContent='...';}});
  try{
    await api.resolveCandidate(id,action);
    candidates=candidates.filter(c=>c.id!==id);
    const card=document.getElementById('c'+id);
    if(card){card.style.opacity='0';card.style.transition='opacity 0.3s';setTimeout(()=>{card.remove();if(!candidates.length)render();},300);}
    document.getElementById('sub').textContent=candidates.length+' pairs need review';
    showToast(action==='merge'?'Merged successfully':'Marked as different people');
  }catch(e){showToast(e.message,'error');}
}
init();
</script>
</body>
</html>
