<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceAlbum — People</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    window.VITE_API_URL = 'https://mdarfan-faceapp-backend.hf.space/';
    window.VITE_API_KEY = '';
  </script>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="nav-brand-dot"></div>
    <span class="nav-brand-name">FaceAlbum</span>
  </div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='../index.html'">Find Me</button>
    <button class="nav-link" onclick="location.href='events.html'">Events</button>
    <button class="nav-link active" onclick="location.href='persons.html'">People</button>
    <button class="nav-link" onclick="location.href='merge.html'">Review</button>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1 class="page-title">People</h1>
    <p class="page-subtitle" id="subtitle">Loading...</p>
  </div>

  <div class="filters">
    <input class="input" id="search" placeholder="Search by name..." style="max-width:280px" />
    <label class="toggle-label">
      <input type="checkbox" id="named-only" />
      Named only
    </label>
  </div>

  <div id="app"></div>
</main>

<script src="../js/api.js"></script>
<script>
const app      = document.getElementById('app');
const subtitle = document.getElementById('subtitle');
const search   = document.getElementById('search');
const namedOnly = document.getElementById('named-only');
let allPersons = [];

async function init() {
  showSpinner(app);
  try {
    const data = await api.getPersons();
    allPersons = data.persons || [];
    const named   = allPersons.filter(p => p.name).length;
    const unnamed = allPersons.length - named;
    subtitle.textContent = `${named} named · ${unnamed} unnamed · ${allPersons.length} total`;
    renderPersons();
  } catch(e) {
    app.innerHTML = `<p style="color:var(--red)">Failed to load people: ${e.message}</p>`;
  }
}

function renderPersons() {
  let list = allPersons;
  if (namedOnly.checked) list = list.filter(p => p.name);
  const q = search.value.toLowerCase();
  if (q) list = list.filter(p => p.name?.toLowerCase().includes(q));

  if (!list.length) { showEmpty(app, '👤', 'No people found', 'Try adjusting your filters.'); return; }

  app.innerHTML = `<div class="person-grid">${list.map(p => `
    <div class="person-card" onclick="location.href='person.html?id=${p.id}'">
      <div class="person-avatar">
        ${p.cover_image_id
          ? `<img src="${thumbUrl(p.cover_image_id)}" alt="${p.name||''}" />`
          : `<span>${initials(p.name)}</span>`}
      </div>
      <div class="person-name">${p.name || '<em>Unnamed</em>'}</div>
      <div class="person-meta">${p.photo_count} photos · ${p.event_count} events</div>
    </div>`).join('')}
  </div>`;
}

search.addEventListener('input', renderPersons);
namedOnly.addEventListener('change', renderPersons);
init();
</script>
</body>
</html>
