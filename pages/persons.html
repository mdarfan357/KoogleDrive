<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>FaceAlbum — People</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <script>window.VITE_API_URL='https://mdarfan-faceapp-backend.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-logo">📸</div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links" id="nav-links"></div>
</nav>
<div class="bottom-nav" id="bottom-nav"></div>
<main class="main">
  <div class="page-header">
    <div class="page-eyebrow">Browse</div>
    <h1 class="page-title">People</h1>
    <p class="page-sub" id="sub">Loading...</p>
  </div>
  <div class="filters">
    <input class="input" id="search" placeholder="Search by name..." style="max-width:260px"/>
    <label class="toggle-label"><input type="checkbox" id="named"/> Named only</label>
  </div>
  <div id="app"></div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
let all=[];
async function init() {
  const user = await requireAuth(); if (!user) return;
  buildNav('persons', user);
  showSpinner(document.getElementById('app'));
  try {
    const data = await api.getPersons();
    all = data.persons||[];
    const named = all.filter(p=>p.name).length;
    document.getElementById('sub').textContent = named + ' named · ' + (all.length-named) + ' unnamed · ' + all.length + ' total';
    render();
  } catch(e) { document.getElementById('app').innerHTML = '<p style="color:var(--rose)">Failed: ' + e.message + '</p>'; }
}
function render() {
  let list = all;
  if (document.getElementById('named').checked) list = list.filter(p=>p.name);
  const q = document.getElementById('search').value.toLowerCase();
  if (q) list = list.filter(p=>p.name?.toLowerCase().includes(q));
  if (!list.length) { showEmpty(document.getElementById('app'), Icons.people, 'No people found', 'Try adjusting your filters.'); return; }
  document.getElementById('app').innerHTML = '<div class="person-grid">' + list.map(p => {
    const avatarInner = p.cover_image_id
      ? '<img src="' + thumbUrl(p.cover_image_id) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>'
      : '<span>' + initials(p.name) + '</span>';
    return '<div class="person-card" onclick="location.href=\'person.html?id=' + p.id + '\'">'
      + '<div class="person-avatar">' + avatarInner + '</div>'
      + '<div class="person-name">' + (p.name || '<em>Unnamed</em>') + '</div>'
      + '<div class="person-meta">' + p.photo_count + ' photos · ' + p.event_count + ' events</div>'
      + '</div>';
  }).join('') + '</div>';
}
document.getElementById('search').addEventListener('input', render);
document.getElementById('named').addEventListener('change', render);
init();
</script>
</body>
</html>
