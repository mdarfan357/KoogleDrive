<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceAlbum — Signing in...</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    window.VITE_API_URL = 'https://mdarfan-faceapp-backend.hf.space';
  </script>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px;">
  <div class="spinner"></div>
  <p id="msg" style="color:var(--text2);font-size:14px;">Signing you in...</p>
</div>

<script src="../js/auth.js"></script>
<script>
(async () => {
  const msg = document.getElementById('msg');

  // Supabase puts token_hash and type in the URL hash after magic link click
  // e.g. #access_token=...&token_type=bearer
  // OR as query params: ?token_hash=...&type=magiclink
  const hash   = new URLSearchParams(location.hash.slice(1));
  const params = new URLSearchParams(location.search);

  const tokenHash = params.get('token_hash') || hash.get('access_token');
  const type      = params.get('type')       || 'magiclink';

  if (!tokenHash) {
    msg.textContent = 'Invalid sign-in link. Please try again.';
    setTimeout(() => location.href = '../login.html?error=expired', 2500);
    return;
  }

  try {
    await verifyMagicLink(tokenHash, type);
    const redirect = sessionStorage.getItem('redirect_after_login') || 'events.html';
    sessionStorage.removeItem('redirect_after_login');
    location.href = redirect;
  } catch(e) {
    msg.textContent = e.message || 'Sign-in failed. Please try again.';
    setTimeout(() => location.href = '../login.html?error=expired', 2500);
  }
})();
</script>
</body>
</html>
