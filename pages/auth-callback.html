<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FaceAlbum — Signing in...</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script>window.VITE_API_URL = 'https://mdarfan-faceapp-backend.hf.space';</script>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px;">
  <div class="spinner"></div>
  <p id="msg" style="color:var(--text2);font-size:14px;">Signing you in...</p>
</div>
<script src="../js/auth.js"></script>
<script>
(async () => {
  const msg  = document.getElementById('msg');
  const hash = new URLSearchParams(location.hash.replace('#',''));
  const token = hash.get('token');

  if (!token) {
    msg.textContent = 'Sign-in failed. Please try again.';
    setTimeout(() => location.href = '../login.html?error=token_failed', 2000);
    return;
  }

  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    setSession({ access_token: token, user: { email: payload.email, name: payload.name } });
    msg.textContent = `Welcome, ${payload.name}! Redirecting...`;
    const r = sessionStorage.getItem('redirect_after_login') || 'events.html';
    sessionStorage.removeItem('redirect_after_login');
    setTimeout(() => location.href = r, 800);
  } catch(e) {
    msg.textContent = 'Sign-in failed. Please try again.';
    setTimeout(() => location.href = '../login.html?error=token_failed', 2000);
  }
})();
</script>
</body>
</html>
