<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceAlbum — Event</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    window.VITE_API_URL      = 'https://mdarfan-faceapp-backend.hf.space';
  </script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-brand-dot"></div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='../index.html'">Find Me</button>
    <button class="nav-link active" onclick="location.href='events.html'">Events</button>
    <button class="nav-link" onclick="location.href='persons.html'">People</button>
    <button class="nav-link" onclick="location.href='merge.html'">Review</button>
  </div>
</nav>
<main class="main">
  <button class="back-btn" onclick="location.href='events.html'">← Events</button>
  <div id="header"></div>
  <div id="app"></div>
  <div class="load-more" id="load-more" style="display:none">
    <button class="btn btn-secondary" id="btn-more">Load more</button>
  </div>
</main>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
const eventId = getParam('id');
if (!eventId) location.href = 'events.html';
let page = 1, allPhotos = [];

async function init() {
  const user = await requireAuth(); if (!user) return;
  renderUserBadge(user);
  try {
    const ev = await api.getEvent(eventId);
    document.title = `FaceAlbum — ${ev.name}`;
    document.getElementById('header').innerHTML = `<div class="page-header"><h1 class="page-title">${ev.name}</h1><p class="page-subtitle">${ev.photo_count||0} photos · ${ev.person_count||0} people${ev.date?` · ${new Date(ev.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`:''}
    </p></div>`;
  } catch(e) { document.getElementById('header').innerHTML = `<div class="page-header"><h1 class="page-title">${eventId}</h1></div>`; }
  showSpinner(document.getElementById('app'));
  await loadPage(1);
}

async function loadPage(p) {
  try {
    const data = await api.getEventPhotos(eventId, p);
    const photos = data.photos || [];
    allPhotos = p === 1 ? photos : [...allPhotos, ...photos];
    const app = document.getElementById('app');
    if (!allPhotos.length) { showEmpty(app, '🖼️', 'No photos yet'); return; }
    app.innerHTML = `<div class="photo-grid">${allPhotos.map(p => `
      <div class="photo-tile" onclick="openLightbox('${imageUrl(p.drive_file_id)}','${p.person_name||''}','${p.person_id||''}')">
        <img src="${thumbUrl(p.drive_file_id)}" alt="" onerror="this.parentElement.innerHTML='<div class=photo-skeleton></div>'" />
        ${p.person_name?`<div class="photo-label">${p.person_name}</div>`:''}
      </div>`).join('')}</div>`;
    document.getElementById('load-more').style.display = photos.length === 50 ? 'block' : 'none';
  } catch(e) { document.getElementById('app').innerHTML = `<p style="color:var(--red)">Failed: ${e.message}</p>`; }
}

document.getElementById('btn-more').onclick = async () => {
  page++;
  document.getElementById('btn-more').textContent = 'Loading...';
  await loadPage(page);
  document.getElementById('btn-more').textContent = 'Load more';
};
init();
</script>
</body>
</html>
