<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>FaceAlbum — Event</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <script>window.VITE_API_URL='https://your-hf-space.hf.space';</script>
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><div class="nav-logo">📸</div><span class="nav-brand-name">FaceAlbum</span></div>
  <div class="nav-links" id="nav-links"></div>
</nav>
<div class="bottom-nav" id="bottom-nav"></div>
<main class="main">
  <button class="back-btn" onclick="location.href='events.html'">← Events</button>
  <div id="header"></div>
  <div id="app"></div>
  <div class="load-more" id="lm" style="display:none">
    <button class="btn btn-secondary" id="btn-more">Load more photos</button>
  </div>
</main>
<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
const eventId=getParam('id');
if(!eventId)location.href='events.html';
let page=1,allPhotos=[];
async function init(){
  const user=await requireAuth();if(!user)return;
  buildNav('events',user);
  try{
    const ev=await api.getEvent(eventId);
    document.title='FaceAlbum — '+ev.name;
    const date=ev.date?new Date(ev.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}):'';
    document.getElementById('header').innerHTML=
      '<div class="page-header">'
      +'<div class="page-eyebrow">Event</div>'
      +'<h1 class="page-title">'+ev.name+'</h1>'
      +'<p class="page-sub">'+(ev.photo_count||0)+' photos · '+(ev.person_count||0)+' people'+(date?' · '+date:'')+'</p>'
      +'</div>';
  }catch(e){document.getElementById('header').innerHTML='<div class="page-header"><h1 class="page-title">'+eventId+'</h1></div>';}
  showSpinner(document.getElementById('app'));
  await loadPage(1);
}
async function loadPage(p){
  try{
    const data=await api.getEventPhotos(eventId,p);
    const photos=data.photos||[];
    allPhotos=p===1?photos:[...allPhotos,...photos];
    const app=document.getElementById('app');
    if(!allPhotos.length){showEmpty(app,Icons.photo,'No photos yet');return;}
    app.innerHTML='<div class="photo-grid">'+allPhotos.map(p=>
      '<div class="photo-tile" onclick="openLightbox(\''+imageUrl(p.drive_file_id)+'\',\''+encodeURIComponent(p.person_name||'')+'\',\''+encodeURIComponent(p.person_id||'')+'\')">'
      +'<img src="'+thumbUrl(p.drive_file_id)+'" alt="" onerror="this.parentElement.innerHTML=\'<div class=photo-skeleton></div>\'" />'
      +(p.person_name?'<div class="photo-label">'+p.person_name+'</div>':'')
      +'</div>').join('')+'</div>';
    document.getElementById('lm').style.display=photos.length===50?'block':'none';
  }catch(e){document.getElementById('app').innerHTML='<p style="color:var(--rose)">Failed: '+e.message+'</p>';}
}
document.getElementById('btn-more').onclick=async()=>{
  document.getElementById('btn-more').textContent='Loading...';
  page++;await loadPage(page);
  document.getElementById('btn-more').textContent='Load more photos';
};
init();
</script>
</body>
</html>
